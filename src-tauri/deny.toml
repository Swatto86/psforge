# cargo deny check advisories (CI audit job).
# Vulnerabilities always fail. Unmaintained notices fail only for crates this
# workspace depends on directly; the transitive ones come from Tauri's own
# dependency tree and are outside this project's control.
[advisories]
unmaintained = "workspace"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
