[package]
name = "psforge"
version = "1.4.47"
description = "PSForge - Modern PowerShell Editor"
authors = ["PSForge Contributors"]
edition = "2021"

[lib]
name = "psforge_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "process",
    "io-util",
    "sync",
] }
log = "0.4"
env_logger = "0.11"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
portable-pty = "0.9"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.dev]
# Faster links: line tables only (panic file:line still works).
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

# Prefer wall-clock compile time: PSForge's hot path is PowerShell, not Rust.
# Default release codegen-units is 16; 64 parallelizes LLVM much more.
[profile.release]
codegen-units = 64
lto = false

