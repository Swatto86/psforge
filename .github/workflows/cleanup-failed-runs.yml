name: cleanup-failed-runs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-failed-runs.yml

permissions:
  actions: write

jobs:
  delete-failed:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let deleted = 0;

            for (let page = 1; page <= 50; page++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                status: 'failure',
                per_page: 100,
                page,
              });

              if (data.workflow_runs.length === 0) break;

              for (const run of data.workflow_runs) {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                deleted++;
                core.info(`Deleted run ${run.id} (${run.name} @ ${run.head_branch})`);
              }

              if (data.workflow_runs.length < 100) break;
            }

            core.info(`Deleted ${deleted} failed workflow run(s).`);
