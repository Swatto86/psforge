name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-22.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            webkit2gtk-driver xvfb xauth

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests (vitest)
        run: npm test

      - name: Frontend build (tsc + vite)
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Install desktop test driver
        run: cargo install tauri-driver --version 2.0.6 --locked --debug

      - name: Build debug application
        run: npx tauri build --debug --no-bundle

      - name: Desktop workflow
        run: xvfb-run -a npm run test:e2e

  # The Linux job compiles out every #[cfg(windows)] block (registry file
  # associations, PS discovery, ConPTY), so Windows-only breakage would only
  # surface after a release tag was already pushed. This leg gates it here.
  check-windows:
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: mozilla-actions/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests (Windows)
        run: npm test

      - name: cargo clippy (windows)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (windows)
        working-directory: src-tauri
        run: cargo test

      - name: Install desktop test tools
        shell: pwsh
        run: |
          cargo install tauri-driver --version 2.0.6 --locked --debug
          if ($LASTEXITCODE -ne 0) { throw 'tauri-driver install failed.' }
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed.' }
          $version = (Get-Content scripts/webview2-runtime.json -Raw | ConvertFrom-Json).version
          $driverDir = Join-Path $env:RUNNER_TEMP 'psforge-edge-driver'
          New-Item -ItemType Directory -Path $driverDir -Force | Out-Null
          $archive = Join-Path $driverDir 'driver.zip'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $driverDir -Force
          $driverDir | Out-File $env:GITHUB_PATH -Append

      - name: Build debug application
        run: npx tauri build --debug --no-bundle

      - name: Build self-contained debug executable
        shell: pwsh
        run: ./scripts/build-portable.ps1 -AppBinary src-tauri/target/debug/psforge.exe -OutputFile PSForge-debug-portable.exe -Fast

      - name: Desktop workflow with bundled runtime
        env:
          PSFORGE_TEST_BINARY: PSForge-debug-portable.exe
          WEBVIEW2_BROWSER_EXECUTABLE_FOLDER: C:\psforge-runtime-must-not-exist
        run: npm run test:e2e
