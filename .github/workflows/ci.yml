name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            webkit2gtk-driver xvfb xauth

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests (vitest)
        run: npm test

      - name: Frontend build (tsc + vite)
        run: npm run build

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --all-targets

      - name: Install desktop test driver
        run: cargo install tauri-driver --version 2.0.6 --locked --debug

      - name: Build debug application
        run: npx tauri build --debug --no-bundle

      - name: Desktop workflow
        run: xvfb-run -a npm run test:e2e

  # The Linux job compiles out every #[cfg(windows)] block (registry file
  # associations, PS discovery, ConPTY), so Windows-only breakage would only
  # surface after a release tag was already pushed. This leg gates it here.
  check-windows:
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests (Windows)
        run: npm test

      - name: cargo clippy (windows)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test (windows)
        working-directory: src-tauri
        run: cargo test --locked --all-targets

      - name: Install desktop test tools
        shell: pwsh
        run: |
          cargo install tauri-driver --version 2.0.6 --locked --debug
          if ($LASTEXITCODE -ne 0) { throw 'tauri-driver install failed.' }
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed.' }
          $version = (Get-Content scripts/webview2-runtime.json -Raw | ConvertFrom-Json).version
          $driverDir = Join-Path $env:RUNNER_TEMP 'psforge-edge-driver'
          New-Item -ItemType Directory -Path $driverDir -Force | Out-Null
          $archive = Join-Path $driverDir 'driver.zip'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $driverDir -Force
          $driverDir | Out-File $env:GITHUB_PATH -Append

      - name: Build debug application
        run: npx tauri build --debug --no-bundle

      - name: Build self-contained debug executable
        shell: pwsh
        run: ./scripts/build-portable.ps1 -AppBinary src-tauri/target/debug/psforge.exe -OutputFile PSForge-debug-portable.exe -Fast

      - name: Desktop workflow with bundled runtime
        env:
          PSFORGE_TEST_BINARY: PSForge-debug-portable.exe
          WEBVIEW2_BROWSER_EXECUTABLE_FOLDER: C:\psforge-runtime-must-not-exist
        run: npm run test:e2e

  # Releases ship a macOS build, so its #[cfg(target_os = "macos")] code must
  # compile, lint and pass tests before a tag. tauri-driver has no macOS
  # support, so the desktop journey stays on the Linux and Windows legs.
  check-macos:
    runs-on: macos-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests (macOS)
        run: npm test

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: cargo clippy (macOS)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test (macOS)
        working-directory: src-tauri
        run: cargo test --locked --all-targets

  # Known-vulnerable dependencies fail the gate. Unmaintained notices only
  # fail for direct dependencies (see src-tauri/deny.toml); transitive ones
  # come from Tauri's own tree and cannot be replaced here.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: npm audit (shipped dependencies)
        run: npm audit --omit=dev
