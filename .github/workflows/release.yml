name: release

on:
  push:
    tags:
      - 'v*'
  # Manual fallback for environments that cannot push tags directly: the
  # tag and the release are created on the dispatched commit. The tag input
  # must match the manifest versions on that commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.17). Created on the dispatched commit if it does not exist."
        required: true
        type: string

jobs:
  # Create the draft release once so matrix jobs do not race creating/updating
  # latest.json (see tauri-apps/tauri-action#1270).
  create-release:
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag: ${{ steps.resolve-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve release tag
        id: resolve-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *)
              echo "::error::Release tag '$tag' must look like v<major>.<minor>.<patch>."
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        env:
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          tag_version="${tag#v}"
          conf_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg_version="$(node -p "require('./package.json').version")"
          cargo_version="$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag_version conf=$conf_version pkg=$pkg_version cargo=$cargo_version"
          if [ "$tag_version" != "$conf_version" ] || [ "$tag_version" != "$pkg_version" ] || [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $tag_version does not match tauri.conf.json ($conf_version) / package.json ($pkg_version) / Cargo.toml ($cargo_version). Tag the commit that bumps all versions, not an earlier one."
            exit 1
          fi

      # A tag must not publish (and auto-install on every client) a commit
      # the CI gate never passed. Push the release commit to main, wait for
      # ci to go green on it, then tag that same commit.
      - name: Require green CI on the release commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const sha = context.sha;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: sha,
              status: 'success',
              per_page: 1,
            });
            if (data.total_count === 0) {
              core.setFailed(`No successful ci run for ${sha}. Push it to main and wait for ci to pass before tagging.`);
            } else {
              core.info(`ci passed for ${sha}: ${data.workflow_runs[0].html_url}`);
            }

      - name: Create or reuse draft release
        id: create-release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              core.info(`Reusing existing release ${data.id} for ${tag}`);
              return data.id;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            // A draft release does not create its tag until it is published,
            // so the build legs (which check out the tag) need the ref to
            // exist now. Tag-push runs already have it.
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.info(`Created tag ${tag} at ${context.sha}`);
            }

            // Drafts are not returned by getReleaseByTag; reuse one left by
            // an earlier failed run rather than accumulating untagged drafts.
            const drafts = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const draft = drafts.find((r) => r.draft && r.tag_name === tag);
            if (draft) {
              core.info(`Reusing draft release ${draft.id} for ${tag}`);
              return draft.id;
            }

            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              draft: true,
              prerelease: false,
              generate_release_notes: true,
            });
            core.info(`Created draft release ${data.id} for ${tag}`);
            return data.id;

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Serialize the matrix so each leg's latest.json read-merge-upload sees
      # the previous leg's file and accumulates its platform entry. Running the
      # legs in parallel lets two read an empty/stale latest.json and clobber
      # each other on upload, so the published manifest can end up with only one
      # platform — tauri-action's retry() does not resolve that clobber because
      # both uploads "succeed" (S3-5). Serial builds are slower but correct.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag }}
          args: ${{ matrix.args }}
          retryAttempts: 5
          # Every leg must merge its own platform entry into latest.json, or
          # macOS/Linux auto-update is permanently broken (only windows-x86_64
          # ever appeared) — the in-app updater then finds no entry for its
          # platform and never offers an update (S3-5). tauri-action's own
          # retry() wraps the read-merge-delete-upload cycle to handle the
          # concurrent-write race, matching the upstream multi-platform example.
          includeUpdaterJson: true

      - name: Stage portable exe
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed.' }
          $ver = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $dest = "PSForge_${ver}_x64-portable.exe"
          ./scripts/build-portable.ps1 -AppBinary src-tauri/target/release/psforge.exe -OutputFile $dest
          "portable_exe=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload portable exe to release
        if: matrix.platform == 'windows-latest'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          PORTABLE_EXE: ${{ env.portable_exe }}
        with:
          script: |
            const fs = require('fs');
            const name = process.env.PORTABLE_EXE;
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID),
              name,
              data: fs.readFileSync(name),
            });
            console.log(`Uploaded ${name}`);

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build]

    steps:
      - name: Add release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          mkdir assets
          gh release download "$RELEASE_TAG" --dir assets
          (cd assets && sha256sum -- * > ../SHA256SUMS)
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber

      - name: Publish release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false,
              prerelease: false,
            });
