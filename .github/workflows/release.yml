name: release

on:
  push:
    tags:
      - 'v*'
  # Manual fallback for environments that cannot push tags directly: the
  # release (and its tag, via createRelease) is cut from the dispatched
  # commit. The tag input must match the manifest versions on that commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.17). Created on the dispatched commit if it does not exist."
        required: true
        type: string

jobs:
  # Create the draft release once so matrix jobs do not race creating/updating
  # latest.json (see tauri-apps/tauri-action#1270).
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag: ${{ steps.resolve-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *)
              echo "::error::Release tag '$tag' must look like v<major>.<minor>.<patch>."
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        run: |
          tag="${{ steps.resolve-tag.outputs.tag }}"
          tag_version="${tag#v}"
          conf_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg_version="$(node -p "require('./package.json').version")"
          cargo_version="$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag_version conf=$conf_version pkg=$pkg_version cargo=$cargo_version"
          if [ "$tag_version" != "$conf_version" ] || [ "$tag_version" != "$pkg_version" ] || [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $tag_version does not match tauri.conf.json ($conf_version) / package.json ($pkg_version) / Cargo.toml ($cargo_version). Tag the commit that bumps all versions, not an earlier one."
            exit 1
          fi

      - name: Create or reuse draft release
        id: create-release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              core.info(`Reusing existing release ${data.id} for ${tag}`);
              return data.id;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            // When the tag does not exist yet (workflow_dispatch fallback),
            // createRelease creates it on target_commitish; for tag-push runs
            // the tag exists and target_commitish is ignored.
            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              draft: true,
              prerelease: false,
              generate_release_notes: true,
            });
            core.info(`Created draft release ${data.id} for ${tag}`);
            return data.id;

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Serialize the matrix so each leg's latest.json read-merge-upload sees
      # the previous leg's file and accumulates its platform entry. Running the
      # legs in parallel lets two read an empty/stale latest.json and clobber
      # each other on upload, so the published manifest can end up with only one
      # platform — tauri-action's retry() does not resolve that clobber because
      # both uploads "succeed" (S3-5). Serial builds are slower but correct.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          retryAttempts: 5
          # Every leg must merge its own platform entry into latest.json, or
          # macOS/Linux auto-update is permanently broken (only windows-x86_64
          # ever appeared) — the in-app updater then finds no entry for its
          # platform and never offers an update (S3-5). tauri-action's own
          # retry() wraps the read-merge-delete-upload cycle to handle the
          # concurrent-write race, matching the upstream multi-platform example.
          includeUpdaterJson: true

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build]

    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false,
              prerelease: false,
            });
